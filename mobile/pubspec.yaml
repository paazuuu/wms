name: wms_mobile
description: WMS mobile client, backed by Supabase (Postgres + Edge Functions).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Localization (Japanese / Chinese / English, generated via gen_l10n)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  # State management
  flutter_riverpod: ^2.5.1
  # HTTP
  dio: ^5.7.0
  # Secure token storage (Web falls back to an encrypted IndexedDB store)
  flutter_secure_storage: ^9.2.2
  # Barcode scanning (Code128/Code39/EAN13/QR)
  mobile_scanner: ^5.2.3
  # On-device OCR for delivery-note assist (Japanese script supported)
  google_mlkit_text_recognition: ^0.13.0
  # Camera / file picking for attachments
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  # Routing
  go_router: ^14.2.7
  # Value equality
  equatable: ^2.0.5
  printing: ^5.15.0
  barcode: ^2.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  # Bundled offline-first fonts (ui-ux-pro-max "Dashboard Data" pairing):
  # Fira Sans for UI/labels, Fira Code (monospace) for codes/barcodes/quantities.
  fonts:
    - family: Fira Sans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FiraSans-Bold.ttf
          weight: 700
    - family: Fira Code
      fonts:
        - asset: assets/fonts/FiraCode-VF.ttf
          weight: 400
        - asset: assets/fonts/FiraCode-VF.ttf
          weight: 600
